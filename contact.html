<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blade Laboratory - Contact Us</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: #0b0b0b;
    }

    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      opacity: 0.4;
      transform: scale(1.25);
    }

    header {
      position: relative;
      z-index: 10;
      background: #000000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-link {
      display: inline-block;
      text-decoration: none;
    }

    .brand-title {
      font-family: serif;
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: #dfba7c;
      text-transform: uppercase;
    }

    .location-text {
      font-size: 0.55rem;
      color: #777;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: -2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
    }

    nav a:hover, nav a.active {
      color: #d4af37;
    }

    .header-hero {
      height: 40px;
      width: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #d4af37;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
      padding: 3rem 1.5rem;
    }

    .content-card {
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 20px;
      padding: 3.5rem 3.5rem;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      color: #ffffff;
    }

    .content-card h2 {
      margin-top: 0;
      margin-bottom: 2rem;
      color: #d4af37;
    }

    .form-group {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .form-group label {
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      color: #e5e5e5;
    }

    .required-asterisk {
      color: #ff4d4d;
      font-weight: bold;
      margin-right: 0.25rem;
    }

    .form-group input,
    .form-group textarea {
      padding: 0.85rem;
      border-radius: 8px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      background-color: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #d4af37;
    }

    .required-disclaimer {
      font-size: 0.8rem;
      color: #aaaaaa;
      margin-top: -0.5rem;
      margin-bottom: 1.5rem;
      display: block;
    }

    .cta-button {
      display: inline-block;
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #dfba7c 0%, #aa7c11 100%);
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(223, 186, 124, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(223, 186, 124, 0.5);
    }

    [data-fs-error] {
      color: #ff6b6b;
      font-size: 0.85rem;
      margin-top: 0.4rem;
      display: block;
    }

    [data-fs-success] {
      color: #2ecc71;
      font-weight: bold;
      margin-bottom: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <video autoplay loop muted playsinline class="bg-video" src="images/contactus.mp4"></video>

  <header>
    <div class="logo-container">
      <a href="index.html" class="logo-link">
        <span class="brand-title">Blade Laboratory</span>
      </a>
      <span class="location-text">Forged in Tampa, Florida</span>
    </div>

    <div class="header-right">
      <nav>
        <a href="index.html">Home</a>
        <a href="what-we-do.html">Our Craft</a>
        <a href="tips.html">Care & Maintenance</a>
        <a href="contact.html" class="active">Contact Us</a>
      </nav>
      <a href="https://www.linkedin.com/" target="_blank">
        <img src="images/hero.jpg" alt="Master Blacksmith" class="header-hero">
      </a>
    </div>
  </header>

  <main>
    <div class="content-card">
      <h2>Inquire & Custom Orders</h2>

      <div data-fs-success></div>
      <div data-fs-error></div>

      <form id="my-form">
        <div class="form-group">
          <label for="name"><span class="required-asterisk">*</span>Name</label>
          <input type="text" id="name" name="name" data-fs-field required placeholder="Jane Doe" />
          <span data-fs-error="name"></span>
        </div>

        <div class="form-group">
          <label for="email"><span class="required-asterisk">*</span>Email Address</label>
          <input type="email" id="email" name="email" data-fs-field required placeholder="name@organization.org" />
          <span data-fs-error="email"></span>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" data-fs-field placeholder="(555) 000-0000" />
          <span data-fs-error="phone"></span>
        </div>

        <div class="form-group">
          <label for="message"><span class="required-asterisk">*</span>Message</label>
          <textarea id="message" name="message" rows="5" data-fs-field required placeholder="Tell us about your custom blade request or order inquiry..."></textarea>
          <span data-fs-error="message"></span>
        </div>

        <span class="required-disclaimer"><span class="required-asterisk">*</span>Indicates required field</span>

        <button type="submit" class="cta-button" data-fs-submit-btn>Send Inquiry</button>
      </form>
    </div>
  </main>

  <script>
    window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
    formspree('initForm', { formElement: '#my-form', formId: 'meaopvpw' });
  </script>
  <script src="https://unpkg.com/@formspree/ajax@1" defer></script>

</body>
</html>
