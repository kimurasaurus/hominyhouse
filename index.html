<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .nav-links a {
            text-decoration: none !important;
            transition: all 0.3s ease-in-out;
            display: inline-block;
        }
        .nav-links a:hover {
            color: var(--accent-color, #00d4ff) !important;
            text-shadow: 0 0 8px #00d4ff, 0 0 16px #00d4ff, 0 0 24px #00d4ff;
            transform: translateY(-2px);
        }

<body>

    <nav style="overflow: visible;">
        <a href="index.html" class="logo" style="overflow: visible;">
            <img src="./images/hominyhouse.jpg" alt="Hominy House Logo" class="main-logo" style="transform: scale(2); transform-origin: left center; opacity: 0.65;">
        </a>
        <ul class="nav-links" style="list-style: none; padding: 0; margin: 0;">
            <li><a href="index.html" style="font-size: 1rem;">Home</a></li>
            <li><a href="models.html" style="font-size: 1rem;">Models</a></li>
            <li><a href="story.html" style="font-size: 1rem;">Story</a></li>

        </ul>

    <header class="hero" style="justify-content: center; align-items: center; padding-top: 0; margin-top: 140px; background: linear-gradient(rgba(10, 10, 12, 0.7), rgba(10, 10, 12, 0.7)), url('./images/1743095627140.jpg') center/cover no-repeat;">

                <img src="./images/1743095654488.jpg" alt="Knife Detail">
                <div class="card-content">
                    <h3>The Edge</h3>
                    <p>Precision Engineering</p>
                </div>
            </div>
            <div class="card">
